version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drip
      POSTGRES_PASSWORD: drip
      POSTGRES_DB: dripengine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drip"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://drip:drip@postgres:5432/dripengine
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_SECRET_KEY: supersecretkey
    volumes:
      - ./sequences:/app/sequences
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./worker
    environment:
      DATABASE_URL: postgresql://drip:drip@postgres:5432/dripengine
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PROVIDER: nodemailer
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-you@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-yourpassword}
      SMTP_FROM: ${SMTP_FROM:-you@gmail.com}
    volumes:
      - ./sequences:/app/sequences
      - ./templates:/app/templates
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata: